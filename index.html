<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>웹 부루마블 - 오리지널 감성 텍스트 패치</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
            color: #333;
        }
        #game-wrapper {
            display: flex;
            gap: 20px;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        
        /* 보드판 영역: 원본 이미지를 배경으로 사용 */
        #board-container {
            width: 800px;
            height: 800px;
            background-image: url('background_image.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            display: grid;
            /* 실제 보드판 비율에 맞게 모서리와 일반칸 비율 조정 */
            grid-template-columns: 1.55fr repeat(9, 1fr) 1.55fr;
            grid-template-rows: 1.55fr repeat(9, 1fr) 1.55fr;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }

        /* 개별 칸: 배경을 투명하게 하여 원본 이미지가 보이게 함 */
        .cell {
            position: relative;
            display: flex;
            box-sizing: border-box;
            /* border: 1px solid rgba(255, 0, 0, 0.2); 디버깅용 테두리 */
        }

        /* 깨진 글자를 덮는 텍스트 라벨 (유리 질감 스티커 느낌) */
        .text-label {
            background: rgba(255, 255, 255, 0.95); /* 깨진 글자를 가리기 위해 불투명하게 */
            backdrop-filter: blur(2px);
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
            border-radius: 4px;
            text-align: center;
            padding: 3px 5px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        /* 각 변의 위치에 따라 라벨이 원본 그림을 안 가리고 글자만 덮도록 정렬 */
        .bottom-row { align-items: flex-start; justify-content: center; padding-top: 8px; }
        .top-row { align-items: flex-end; justify-content: center; padding-bottom: 8px; }
        .left-row { align-items: center; justify-content: flex-end; padding-right: 8px; }
        .right-row { align-items: center; justify-content: flex-start; padding-left: 8px; }
        
        .corner { align-items: center; justify-content: center; }
        .corner .text-label { padding: 8px; background: rgba(255,255,255,0.85); font-size: 15px; }

        /* 폰트 스타일 */
        .name { font-size: 13px; font-weight: 900; letter-spacing: -0.5px; word-break: keep-all; line-height: 1.1; }
        .price { font-size: 11px; color: #d32f2f; margin-top: 3px; font-weight: bold; }
        .icon { font-size: 14px; margin-top: 2px; }

        /* 플레이어 말 및 마커 */
        .token {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            position: absolute;
            border: 2px solid white;
            box-shadow: 1px 1px 5px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
            z-index: 10;
            top: 50%; left: 50%;
        }
        .p1 { background-color: #ff3333; transform: translate(-80%, -80%); }
        .p2 { background-color: #3333ff; transform: translate(-20%, -20%); }
        
        .owner-marker {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.9);
            box-shadow: 0 0 3px rgba(0,0,0,0.5);
            z-index: 5;
        }

        /* 우측 UI 패널 */
        #ui-panel {
            width: 300px;
            display: flex;
            flex-direction: column;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #ccc;
        }
        .status { font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 20px; }
        .active-p1 { color: #ff3333; }
        .active-p2 { color: #3333ff; }
        button {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background-color: #005a32;
            color: white;
            border: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        button:hover { background-color: #003d22; }
        .log-box {
            flex-grow: 1;
            background: white;
            border: 1px solid #ddd;
            padding: 10px;
            overflow-y: auto;
            font-size: 13px;
            height: 250px;
            margin-top: 10px;
        }
        .player-info {
            font-size: 16px;
            font-weight: bold;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            background: #fff;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <!-- 원본 이미지가 적용된 보드판 -->
    <div id="board-container"></div>

    <!-- 우측 상태 조작창 -->
    <div id="ui-panel">
        <h2 style="margin-top:0; color:#005a32; text-align:center;">게임 컨트롤</h2>
        <div id="turn-indicator" class="status active-p1">🔴 P1 차례</div>
        
        <div class="player-info" style="border-left: 5px solid #ff3333;">
            🔴 P1 자산: <span id="money-0">300</span>만 원
        </div>
        <div class="player-info" style="border-left: 5px solid #3333ff;">
            🔵 P2 자산: <span id="money-1">300</span>만 원
        </div>

        <button id="roll-btn">주사위 굴리기</button>
        <div id="dice-result" style="text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 10px;">🎲 -</div>
        
        <div style="font-weight: bold; margin-top: 10px;">게임 기록</div>
        <div id="game-log" class="log-box"></div>
    </div>
</div>

<script>
    const boardContainer = document.getElementById('board-container');
    const logBox = document.getElementById('game-log');

    // 요청하신 정확한 텍스트 데이터 셋
    const spaces = [
        { name: "출발", type: "corner" }, // 0
        { name: "타이베이", color: "#ff9a9e", price: 5 }, { name: "황금열쇠", icon: "🔑" }, { name: "베이징", color: "#ff9a9e", price: 8 },
        { name: "마닐라", color: "#ff9a9e", price: 8 }, { name: "제주도", color: "#a1c4fd", price: 20 }, { name: "싱가포르", color: "#ff9a9e", price: 10 },
        { name: "황금열쇠", icon: "🔑" }, { name: "카이로", color: "#ff9a9e", price: 10 }, { name: "이스탄불", color: "#ff9a9e", price: 12 },
        { name: "무인도", type: "corner" }, // 10
        { name: "아테네", color: "#a1c4fd", price: 14 }, { name: "황금열쇠", icon: "🔑" }, { name: "코펜하겐", color: "#a1c4fd", price: 16 },
        { name: "스톡홀름", color: "#a1c4fd", price: 16 }, { name: "콩코드", color: "#ccc", price: 20 }, { name: "베른", color: "#a1c4fd", price: 18 },
        { name: "황금열쇠", icon: "🔑" }, { name: "베를린", color: "#a1c4fd", price: 18 }, { name: "오타와", color: "#a1c4fd", price: 20 },
        { name: "우주여행", type: "corner" }, // 20
        { name: "부에노스<br>아이레스", color: "#a8e063", price: 22 }, { name: "황금열쇠", icon: "🔑" }, { name: "상파울루", color: "#a8e063", price: 24 },
        { name: "시드니", color: "#a8e063", price: 24 }, { name: "부산", color: "#a1c4fd", price: 50 }, { name: "하와이", color: "#a8e063", price: 26 },
        { name: "리스본", color: "#a8e063", price: 26 }, { name: "퀸엘리자베스", color: "#ccc", price: 30 }, { name: "마드리드", color: "#a8e063", price: 28 },
        { name: "사회복지<br>기금", type: "corner" }, // 30
        { name: "도쿄", color: "#ffd0a6", price: 30 }, { name: "콜롬비아호", color: "#ccc", price: 35 }, { name: "파리", color: "#ffd0a6", price: 32 },
        { name: "로마", color: "#ffd0a6", price: 32 }, { name: "황금열쇠", icon: "🔑" }, { name: "런던", color: "#ffd0a6", price: 35 },
        { name: "뉴욕", color: "#ffd0a6", price: 35 }, { name: "국세청", icon: "💰" }, { name: "서울", color: "#ffd0a6", price: 100 }
    ];

    // CSS Grid로 투명한 칸 및 라벨 생성
    spaces.forEach((space, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = `cell-${i}`;
        
        let row, col, rowClass;
        if (i === 0)      { row = 11; col = 11; rowClass = 'corner'; }
        else if (i < 10)  { row = 11; col = 11 - i; rowClass = 'bottom-row'; }
        else if (i === 10){ row = 11; col = 1; rowClass = 'corner'; }
        else if (i < 20)  { row = 11 - (i - 10); col = 1; rowClass = 'left-row'; }
        else if (i === 20){ row = 1; col = 1; rowClass = 'corner'; }
        else if (i < 30)  { row = 1; col = 1 + (i - 20); rowClass = 'top-row'; }
        else if (i === 30){ row = 1; col = 11; rowClass = 'corner'; }
        else              { row = 1 + (i - 30); col = 11; rowClass = 'right-row'; }

        cell.style.gridRow = row;
        cell.style.gridColumn = col;
        cell.classList.add(rowClass);

        // 원본 컬러바는 살리고 깨진 텍스트만 가리는 라벨 생성
        const label = document.createElement('div');
        label.className = 'text-label';
        
        let innerHTML = `<div class="name">${space.name}</div>`;
        if (space.icon) innerHTML += `<div class="icon">${space.icon}</div>`;
        if (space.price) innerHTML += `<div class="price">${space.price}만</div>`;
        label.innerHTML = innerHTML;

        cell.appendChild(label);
        boardContainer.appendChild(cell);

        // 게임 로직을 위한 통행료 및 소유권 데이터 추가
        space.toll = space.price ? Math.floor(space.price / 2) : 0;
        space.owner = null;
    });

    // 플레이어 데이터 및 초기화
    let players = [
        { id: 0, name: "P1", pos: 0, money: 300, color: "#ff3333" },
        { id: 1, name: "P2", pos: 0, money: 300, color: "#3333ff" }
    ];
    let currentTurn = 0;

    function addLog(msg) {
        logBox.innerHTML += `<div>${msg}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    function updateUI() {
        document.getElementById('money-0').innerText = players[0].money;
        document.getElementById('money-1').innerText = players[1].money;
        const turnIndicator = document.getElementById('turn-indicator');
        turnIndicator.innerText = currentTurn === 0 ? "🔴 P1 차례" : "🔵 P2 차례";
        turnIndicator.className = currentTurn === 0 ? "status active-p1" : "status active-p2";
    }

    function renderTokens() {
        document.querySelectorAll('.token').forEach(el => el.remove());
        players.forEach(p => {
            const cell = document.getElementById(`cell-${p.pos}`);
            const token = document.createElement('div');
            token.className = `token p${p.id + 1}`;
            cell.appendChild(token);
        });
    }

    // 주사위 굴리기
    document.getElementById('roll-btn').addEventListener('click', () => {
        const d1 = Math.floor(Math.random() * 6) + 1;
        const d2 = Math.floor(Math.random() * 6) + 1;
        const total = d1 + d2;
        const isDouble = (d1 === d2);
        
        let p = players[currentTurn];
        document.getElementById('dice-result').innerText = `🎲 ${d1} + ${d2} = ${total}`;
        addLog(`<strong>${p.name}</strong> 주사위 ${total} 이동 ${isDouble ? '(더블!)' : ''}`);

        p.pos = (p.pos + total) % 40;
        renderTokens();

        const currentSpace = spaces[p.pos];
        
        setTimeout(() => {
            if (currentSpace.price) {
                if (currentSpace.owner === null) {
                    if (confirm(`${currentSpace.name.replace('<br>','')} 땅을 ${currentSpace.price}만 원에 구매하시겠습니까?`)) {
                        if (p.money >= currentSpace.price) {
                            p.money -= currentSpace.price;
                            currentSpace.owner = p.id;
                            addLog(`▶ ${p.name} 땅 구매 완료`);
                            
                            // 소유권 마커 추가
                            const marker = document.createElement('div');
                            marker.className = 'owner-marker';
                            marker.style.backgroundColor = p.color;
                            document.getElementById(`cell-${p.pos}`).appendChild(marker);
                        } else {
                            alert("잔액이 부족합니다.");
                        }
                    }
                } else if (currentSpace.owner !== p.id) {
                    const owner = players[currentSpace.owner];
                    alert(`앗! ${owner.name}의 땅입니다. 통행료 ${currentSpace.toll}만 원을 지불합니다.`);
                    p.money -= currentSpace.toll;
                    owner.money += currentSpace.toll;
                    addLog(`▶ ${p.name}가 통행료 ${currentSpace.toll}만 원 지불`);
                }
            } else {
                addLog(`▶ ${currentSpace.name.replace('<br>','')} 도착`);
            }

            updateUI();
            if (!isDouble) {
                currentTurn = (currentTurn + 1) % 2;
                updateUI();
            }
        }, 300);
    });

    renderTokens();
    updateUI();
</script>

</body>
</html>
